openapi: 3.0.3
info:
  title: Syrian National Address Pilot API
  version: 0.1.0
  description: Pilot interface; not a legally authoritative national service.
servers:
  - url: /api/v1
paths:
  /addresses:
    get:
      summary: Search public addresses as GeoJSON
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 100}
      responses:
        "200":
          description: GeoJSON FeatureCollection without owner/resident data
          content:
            application/json:
              schema: {type: object}
  /addresses/{id}:
    get:
      summary: Read one public address
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200": {description: Address}
        "404": {description: Not found}
  /auth/login:
    post:
      summary: Pilot login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username,password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
      responses:
        "200": {description: Short-lived pilot token}
        "401": {description: Invalid credentials}
  /change-requests:
    get:
      summary: List change requests
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Requests}
    post:
      summary: Submit a change request
      security: [{bearerAuth: []}]
      responses:
        "201": {description: Submitted}
  /change-requests/{id}/{action}:
    post:
      summary: Review, approve or reject according to role and state
      security: [{bearerAuth: []}]
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
        - {in: path, name: action, required: true, schema: {type: string, enum: [review,approve,reject]}}
      responses:
        "200": {description: Transition completed}
        "403": {description: Role not permitted}
        "409": {description: Invalid state transition}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
